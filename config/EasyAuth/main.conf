# Astropunk Hosting: premium verification and shared-password offline access.
# This adapter requires online-mode=true in the host's server.properties.
premium-auto-login: true
offline-by-default: false
floodgate-auto-login: false

# Do not reuse an offline login merely because its network address matches.
session-timeout: -1
max-login-tries: 3
kick-timeout: 60
reset-login-attempts-timeout: 120

# Set the real password privately in the host console before admitting players:
# auth setGlobalPassword YOUR_PRIVATE_PASSWORD false
# Restart after setting it. Never distribute config/EasyAuth/technical.conf.
enable-global-password: true
single-use-global-password: false

hide-player-coords: false
world-spawn: {
  dimension: "minecraft:overworld"
  x: 0
  y: 64
  z: 0
  yaw: 0
  pitch: 0
}
debug: false
config-version: 2
