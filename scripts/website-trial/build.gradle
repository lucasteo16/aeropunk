plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '1.0.0'
group = 'dev.astropunk'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = '21.1.255'
    mods { astropunk_handbook_access { sourceSet sourceSets.main } }
    runs {
        exportGuide {
            client()
            gameDirectory = file('run')
            systemProperty 'neoforge.enableGameTest', 'false'
            systemProperty 'connector.clean.path', '/home/tsb/Projects/lucas/astropunk-guide/build/handbook-access/.gradle-user-home/caches/neoformruntime/intermediate_results/rename_b57a0bab1b81c4ee1c33b783f1e2d0832906ba17_output.jar'
            systemProperty 'astropunk.websiteTrial.destination', file('exported/en_us').absolutePath
            programArgument '--username'
            programArgument 'WebsiteTrial'
            jvmArgument '-Xmx8G'
        }
    }
}
dependencies {
    compileOnly files('guideme-21.1.19.jar', 'emi-1.1.24+1.21.1+neoforge.jar')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
