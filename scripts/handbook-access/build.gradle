plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '1.0.0'
group = 'dev.astropunk'
base { archivesName = 'astropunk-handbook-access' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = '21.1.255'
    mods {
        astropunk_handbook_access { sourceSet sourceSets.main }
    }
}
dependencies {
    compileOnly files('guideme-21.1.19.jar')
    compileOnly files('emi-1.1.24.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    systemProperty 'java.io.tmpdir', layout.buildDirectory.dir('test-tmp').get().asFile.absolutePath
    doFirst { layout.buildDirectory.dir('test-tmp').get().asFile.mkdirs() }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
